name: no-ai-attribution

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject commits with AI attribution
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="$BASE..$HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          bad=0
          for c in $(git rev-list "$range"); do
            if git log -1 --format='%an %ae%n%cn %ce%n%B' "$c" | grep -qiE -f .githooks/forbidden-lines.regex; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") contains AI attribution"
              bad=1
            fi
          done
          exit $bad

      - name: Reject AI tool files and mentions in the content
        run: |
          set -euo pipefail
          bad=0
          for f in CLAUDE.md AGENTS.md GEMINI.md .claude .cursor .codex .github/copilot-instructions.md; do
            if [ -e "$f" ]; then echo "::error::$f must not be in this repository"; bad=1; fi
          done
          if git grep -nIiwE 'claude|anthropic|openai|chatgpt|copilot|gemini|codex' -- . ':!.githooks/forbidden-lines.regex' ':!.github/workflows/no-ai-attribution.yml' ':!.gitignore'; then
            echo "::error::the content mentions an AI assistant"
            bad=1
          fi
          exit $bad
